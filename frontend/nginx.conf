server {
    # Unprivileged nginx cannot bind :80; ALB/compose target 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does not inherit parent add_header into locations that set their own.
        add_header X-Content-Type-Options "nosniff" always;
        # TDMRep: text and data mining of served site content is reserved.
        add_header tdm-reservation "1" always;
    }

    # Service worker and PWA manifest must not be long-cached.
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header tdm-reservation "1" always;
        try_files $uri =404;
    }

    # SPA history fallback: serve index.html for client-side routes.
    # Security headers apply to this location, which serves the HTML shell
    # that runs the authenticated app. CSP allows same-origin scripts/XHR,
    # Google Fonts, HTTPS API overrides (Settings), and HTTPS partner-ad iframes.
    # Never long-cache the HTML shell (it references hashed /assets/).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; frame-src https:; worker-src 'self'; manifest-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header tdm-reservation "1" always;
        try_files $uri $uri/ /index.html;
    }
}
