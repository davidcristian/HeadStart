<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    .sky-a { stop-color: #0d1d1a; }
    .sky-b { stop-color: #061010; }
    .climb-a { stop-color: #34d399; }
    .climb-b { stop-color: #d9f99d; }
    .peak { fill: #a3e635; opacity: 0.28; }
    @media (prefers-color-scheme: light) {
      .sky-a { stop-color: #eafaf1; }
      .sky-b { stop-color: #d3efe0; }
      .climb-a { stop-color: #059669; }
      .climb-b { stop-color: #65a30d; }
      .peak { fill: #86efac; opacity: 0.55; }
    }
  </style>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop class="sky-a"/>
      <stop class="sky-b" offset="1"/>
    </linearGradient>
    <linearGradient id="climb" x1="120" y1="400" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop class="climb-a"/>
      <stop class="climb-b" offset="1"/>
    </linearGradient>
    <filter id="peak" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <circle class="peak" cx="378" cy="140" r="58" filter="url(#peak)"/>
  <g stroke="url(#climb)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 126 392 H 212 V 306 H 298 V 220"/>
    <path d="M 298 220 L 352 166"/>
    <path d="M 322 155 L 378 140 L 363 196"/>
  </g>
</svg>
