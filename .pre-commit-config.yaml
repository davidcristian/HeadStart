# Pre-commit hooks. Install with `make setup` (runs `pre-commit install`).
# These mirror the CI quality gate so drift is caught before it lands.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint (changed files)
        language: system
        entry: bash -c 'cd frontend && npx eslint --max-warnings=0'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
