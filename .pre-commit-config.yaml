# Pre-commit hooks. Install with `just setup` (runs `pre-commit install`).
# These mirror the CI quality gate so drift is caught before it lands.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Mirror the CI backend gate exactly (see scripts/lint.sh): `ruff check app
  # tests` + `black --check app tests`. CI does NOT run `ruff format` — black is
  # the sole formatter, and ruff-format disagrees with black on some constructs,
  # so running both here reformat-loops. CI also does not lint alembic/, so the
  # scope is app|tests. Pins track the versions `pip install -e backend[dev]`
  # resolves today; bump them together with the pyproject floors to avoid drift.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/(app|tests)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/(app|tests)/

  # Frontend eslint must pass an explicit path (`.`): ESLint 8 with no path
  # argument lints zero files and always exits 0 (OPS-03). Matches `npm run lint`.
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint
        language: system
        entry: bash -c 'cd frontend && npx eslint . --max-warnings=0'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
