# Pre-commit hooks. Install with `just setup` (runs `pre-commit install`).
# Fast local subset of the CI quality gate (ruff/black/eslint/prettier + LOC +
# shell syntax). Types, tests, and coverage stay in `just check` / ci.yml
# because they are too slow for every commit. See docs/modules/deployment.md.
default_language_version:
  python: python3.12

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Mirror the CI backend gate exactly (see scripts/lint.sh): `ruff check app
  # tests` + `black --check app tests`. CI does NOT run `ruff format` because
  # black is the sole formatter, and ruff-format disagrees with black on some
  # constructs, so running both here reformat-loops. CI also does not lint
  # alembic/, so the scope is app|tests. Pins track the versions that `pip
  # install -e backend[dev]` resolves today; bump them together with the
  # pyproject floors to avoid drift.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/(app|tests)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/(app|tests)/

  # Frontend eslint must pass an explicit path (`.`): ESLint 8 with no path
  # argument lints zero files and always exits 0. Matches `npm run lint`.
  # LOC / shell / prettier close the remaining gaps that CI already
  # covers via `just lint` / `just test --scripts`.
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint
        language: system
        entry: bash -c 'cd frontend && npx eslint . --max-warnings=0'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: frontend prettier
        language: system
        entry: bash -c 'cd frontend && npm run format:check --silent'
        files: ^frontend/src/.*\.(ts|tsx|css|json|md)$
        pass_filenames: false
      - id: check-loc
        name: file length (LOC) gate
        language: system
        entry: bash scripts/check_loc.sh
        files: \.(py|ts|tsx)$
        pass_filenames: false
      - id: validate-shell-scripts
        name: shell script validation
        language: system
        entry: bash scripts/validate-shell-scripts.sh
        files: ^scripts/.*\.sh$
        pass_filenames: false
      - id: check-text
        name: text gate (dashes, tracker ids)
        language: system
        entry: bash scripts/check_text.sh
        pass_filenames: false
      - id: check-commit-msg
        name: commit message gate
        language: system
        entry: bash scripts/check_commit_msg.sh
        stages: [commit-msg]
