# Full local stack. Same images used in AWS; only the orchestration differs.
#   make up        -> build + start everything
#   make migrate   -> apply DB migrations
#   make logs      -> tail logs
#
# An optional self-hosted ntfy server is available via the "offline" profile:
#   docker compose --profile offline up -d ntfy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-headstart}
      # Require an explicit password from .env; no weak compose default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-headstart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only so LAN peers cannot reach Postgres.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headstart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only: local Redis has no AUTH.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    # :local is the compose build tag, not the registry :latest tag.
    image: headstart/backend:local
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Match ECS api healthCheck: wait until uvicorn serves /api/v1/health.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: headstart/backend-worker:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${METRICS_PORT:-9090}:${METRICS_PORT:-9090}"
    # Match ECS worker healthCheck: /metrics 200 or 401 proves the port is up.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.error,urllib.request; p=os.environ.get('METRICS_PORT','9090');\ntry:\n urllib.request.urlopen(f'http://127.0.0.1:{p}/metrics', timeout=2)\nexcept urllib.error.HTTPError as e:\n assert e.code in (401, 403)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  beat:
    image: headstart/backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    command: ["beat"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Match ECS beat healthCheck: a live celery beat cmdline under /proc.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; assert any(b'beat' in Path(f'/proc/{p.name}/cmdline').read_bytes() for p in Path('/proc').iterdir() if p.name.isdigit())\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: headstart/frontend:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Optional fully-offline notifications. Enable with: --profile offline
  # Pin version + multi-arch index digest so `compose pull` cannot float.
  ntfy:
    image: binwiederhier/ntfy:v2.25.0@sha256:cfbbb1bac9196cb711e29ef0ac4adaeb033be6235f1df857705dc39c14384a1d
    profiles: ["offline"]
    command: ["serve"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://localhost:8090
    ports:
      - "8090:80"
    volumes:
      - ntfydata:/var/lib/ntfy

volumes:
  pgdata:
  ntfydata:
