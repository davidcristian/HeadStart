name: Deploy

# Builds + pushes images to ECR, runs DB migrations, and rolls the ECS services.
# Manual-only: this workflow never runs on push. Trigger it from the Actions tab
# ("Run workflow", choose beta/prod; GitHub Environment protection can require an
# approval). The deploy job is additionally guarded on the `AWS_ROLE_ARN` repo
# variable, so it no-ops until the AWS OIDC role is configured.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'beta' }}
    # Skips cleanly (no failure) until the AWS OIDC role variable is configured.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'beta' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'beta' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push, migrate, and roll services
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECS_CLUSTER: headstart-${{ env.TARGET_ENV }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_BASE_URL: /api
        run: ./scripts/deploy.sh

      - name: Notify Slack (result)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          emoji=":white_check_mark:"; [ "$STATUS" != "success" ] && emoji=":x:"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${emoji} Deploy to *${TARGET_ENV}* ${STATUS} - \`${GITHUB_SHA::7}\` (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}" \
            "$SLACK_WEBHOOK_URL"
