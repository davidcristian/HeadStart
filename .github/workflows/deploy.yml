name: Deploy

# Builds + pushes images to ECR, runs DB migrations, and rolls the ECS services.
# Manual-only: this workflow never runs on push. Trigger it from the Actions tab
# ("Run workflow", choose beta/prod). The deploy job is guarded on
# `vars.AWS_ROLE_ARN`, so it no-ops until the AWS OIDC role is configured.
#
# OIDC / deploy hardening (defense in depth):
# 1. In-workflow ref scope: job `if` allows only refs/heads/main|master.
# 2. GitHub Environment (`beta` / `prod`): enable required reviewers in
#    Settings → Environments so a human must approve before credentials run.
# 3. IAM trust policy for AWS_ROLE_ARN MUST pin the OIDC `sub` claim to those
#    refs (and optionally to `environment:beta|prod`). Never use a wildcard
#    like `repo:OWNER/REPO:*`, because it lets any branch/workflow assume the role.
#    Example Condition StringEquals:
#      token.actions.githubusercontent.com:aud: sts.amazonaws.com
#      token.actions.githubusercontent.com:sub: repo:OWNER/REPO:ref:refs/heads/main
# 4. Branch protection on main/master is assumed so only reviewed code is
#    dispatchable from those refs.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'beta' }}
    # Skips cleanly until AWS OIDC is configured; the ref check also refuses non-default refs.
    if: ${{ vars.AWS_ROLE_ARN != '' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'beta' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'beta' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      # Pin third-party actions to full commit SHAs (mutable tags cannot move under us).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          # CloudTrail-friendly session id; pairs with IAM sub/aud pins above.
          role-session-name: headstart-deploy-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build, push, migrate, and roll services
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECS_CLUSTER: headstart-${{ env.TARGET_ENV }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_BASE_URL: /api
        run: ./scripts/deploy.sh

      - name: Notify Slack (result)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          emoji=":white_check_mark:"; [ "$STATUS" != "success" ] && emoji=":x:"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${emoji} Deploy to *${TARGET_ENV}* ${STATUS} - \`${GITHUB_SHA::7}\` (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}" \
            "$SLACK_WEBHOOK_URL"
