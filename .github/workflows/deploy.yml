name: Deploy

# Builds + pushes images to ECR, runs DB migrations, and rolls the ECS services.
# Pushing to main deploys `dev`; deploy `prod` via the manual "Run workflow"
# button (GitHub Environment protection can require an approval).

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push, migrate, and roll services
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECS_CLUSTER: jobnotifier-${{ env.TARGET_ENV }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_BASE_URL: /api
        run: ./scripts/deploy.sh

      - name: Notify Slack (result)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          emoji=":white_check_mark:"; [ "$STATUS" != "success" ] && emoji=":x:"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${emoji} Deploy to *${TARGET_ENV}* ${STATUS} - \`${GITHUB_SHA::7}\` (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}" \
            "$SLACK_WEBHOOK_URL"
