name: Terraform

on:
  pull_request:
    paths:
      - "devops/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Validate & plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [beta, prod]
    defaults:
      run:
        working-directory: devops/terraform/environments/${{ matrix.env }}
    steps:
      # OPS-20: pin third-party actions to full commit SHAs (mutable tags cannot move under us).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Format check
        working-directory: devops/terraform
        run: terraform fmt -recursive -check

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # A real plan needs AWS credentials + remote state. Enable once the
      # backend bucket exists and OIDC role is configured (see deploy.yml).
      - name: Plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_credentials_secret_key: ${{ secrets.TF_VAR_CREDENTIALS_SECRET_KEY }}
        run: terraform plan -input=false -no-color
