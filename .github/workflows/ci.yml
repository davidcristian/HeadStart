name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh --dev
      # OPS-19: fail on known CVEs in hashed backend lockfiles (pip-audit).
      - name: Audit (pip-audit on lockfiles)
        run: just audit-backend
      # CI runs the same scripts as local dev, through the same just recipes,
      # so the gates cannot drift apart (LOC rides with lint; shell with test).
      - name: Lint (ruff + black + LOC gate)
        run: just lint --backend
      - name: Type-check (mypy)
        run: just typecheck --backend
      - name: Tests (pytest)
        run: just test --backend
      - name: Shell script validation
        run: just test --scripts

  migrations:
    name: Migrations (alembic on Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh
      # Backend tests run on SQLite, so dialect-specific migration SQL is only
      # ever exercised here, against the production dialect (Postgres).
      - name: Apply all migrations to a fresh Postgres
        run: just test-migrations

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: npm ci
        working-directory: frontend
      # FRO-12: fail on high/critical advisories (esbuild SSRF class + peers).
      - name: Audit (npm audit --audit-level=high)
        run: just audit-frontend
      # `just lint --frontend` runs eslint + prettier --check (OPS-04).
      - name: Lint (eslint + prettier)
        run: just lint --frontend
      - name: Type-check (tsc)
        run: just typecheck --frontend
      - name: Tests (vitest)
        run: just test --frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  notify:
    name: Slack notify on failure
    needs: [backend, frontend, migrations]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: CI failed on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}) - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
