name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      # OPS-20: pin third-party actions to full commit SHAs (mutable tags cannot move under us).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh --dev
      # OPS-19: fail on known CVEs in hashed backend lockfiles (pip-audit).
      - name: Audit (pip-audit on lockfiles)
        run: just audit-backend
      # OPS-22: same scripts/check.sh entrypoint as local `just check` (no
      # hand-rolled ruff/black/mypy/pytest). Shell rides with --scripts.
      - name: Check (lint + types + tests)
        run: just check --backend
      - name: Shell script validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          just check --scripts

  migrations:
    name: Migrations (alembic on Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh
      # Backend tests run on SQLite, so dialect-specific migration SQL is only
      # ever exercised here, against the production dialect (Postgres).
      - name: Apply all migrations to a fresh Postgres
        run: just test-migrations

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: npm ci
        working-directory: frontend
      # FRO-12: fail on high/critical advisories (esbuild SSRF class + peers).
      - name: Audit (npm audit --audit-level=high)
        run: just audit-frontend
      # OPS-22: same scripts/check.sh entrypoint as local `just check`
      # (eslint + prettier + tsc + vitest via lint/typecheck/test scripts).
      - name: Check (lint + types + tests)
        run: just check --frontend
      - name: Build
        run: just build-frontend

  notify:
    name: Slack notify on failure
    needs: [backend, frontend, migrations]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # OPS-21: job-level env is visible to step `if`; step-level env is not.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: CI failed on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}) - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
