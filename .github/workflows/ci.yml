name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    # PR only: the local commit-msg hook cannot see commits pushed from
    # elsewhere, and the host writes squash/merge subjects itself.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rev-list needs both endpoints; a shallow clone cannot resolve the range.
          fetch-depth: 0
      - name: Check commit messages
        run: |
          ./scripts/check_commit_msg.sh --range \
            "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      # Pin third-party actions to full commit SHAs (mutable tags cannot move under us).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/devops run the commit-msg gate over a rev range; depth 1 cannot resolve it.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh --dev
      # Fail on known CVEs in hashed backend lockfiles (pip-audit).
      - name: Audit (pip-audit on lockfiles)
        run: just audit-backend
      # Same scripts/check.sh entrypoint as local `just check` (no
      # hand-rolled ruff/black/mypy/pytest). Shell rides with --scripts.
      - name: Check (lint + types + tests)
        run: just check --backend
      - name: Shell script validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          just check --scripts

  migrations:
    name: Migrations (alembic on Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: ./scripts/install-backend.sh
      # Backend tests run on SQLite, so dialect-specific migration SQL is only
      # ever exercised here, against the production dialect (Postgres).
      - name: Apply all migrations to a fresh Postgres
        run: just test-migrations

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: npm ci
        working-directory: frontend
      # Fail on high/critical advisories (esbuild SSRF class + peers).
      - name: Audit (npm audit --audit-level=high)
        run: just audit-frontend
      # Same scripts/check.sh entrypoint as local `just check`
      # (eslint + prettier + tsc + vitest via lint/typecheck/test scripts).
      - name: Check (lint + types + tests)
        run: just check --frontend
      - name: Build
        run: just build-frontend

  notify:
    name: Slack notify on failure
    needs: [backend, frontend, migrations]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Job-level env is visible to step `if`; step-level env is not.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: CI failed on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}) - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
